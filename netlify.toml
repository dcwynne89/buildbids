# ── BuildBids · netlify.toml ──────────────────────────────────────────────────
# Canonical: https://buildbids.co

# ── Bot Blocking (404 — give bots nothing) ────────────────────────────────────
[[redirects]]
  from   = "/wp-admin/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/wordpress/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/wp-login.php"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/xmlrpc.php"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/.env"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/.git/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/meta.json"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/_next/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/config.php"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/admin/*"
  to     = "/404.html"
  status = 404
  force  = true

# ── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.r2.dev https://*.cloudflarestorage.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.r2.dev https://*.cloudflarestorage.com; frame-src https://accounts.google.com https://*.firebaseapp.com; frame-ancestors 'self' https://vital-plating-422300-u2.web.app https://gigledger.co"

# ── CORS ──────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
